$schema: 'https://moonrepo.dev/schemas/tasks.json'

inheritedBy:
  tag: 'publish-crates'

tasks:
  publish-crates:
    command: 'bash'
    args:
      - '-lc'
      - |
        set -o pipefail
        mkdir -p .moon/tmp
        log_file="$$(mktemp .moon/tmp/cargo-publish.XXXXXX.log)"
        cleanup() {
          rm -f "$$log_file"
        }
        trap cleanup EXIT

        if cargo publish --locked 2>&1 | tee "$$log_file"; then
          exit 0
        fi

        if grep -Eq 'already (exists on crates\.io index|uploaded)' "$$log_file"; then
          echo 'Crate version already exists on crates.io, continuing.'
          exit 0
        fi

        exit 1
    options:
      cache: false
