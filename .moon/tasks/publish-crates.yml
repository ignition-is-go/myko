$schema: 'https://moonrepo.dev/schemas/tasks.json'

inheritedBy:
  tag: 'publish-crates'

tasks:
  publish-crates:
    command: 'bash'
    args:
      - '-lc'
      - |
        output=""
        if output="$$(cargo publish --locked 2>&1)"; then
          printf '%s\n' "$${output}"
          exit 0
        fi

        printf '%s\n' "$${output}"

        if printf '%s\n' "$${output}" | grep -Eq '(crate .+ )?already exists on crates\.io index|already uploaded'; then
          echo 'Crate version already exists on crates.io, continuing.'
          exit 0
        fi

        exit 1
    options:
      cache: false
