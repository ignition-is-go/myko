$schema: 'https://moonrepo.dev/schemas/tasks.json'

inheritedBy:
  tag: 'publish-crates'

tasks:
  publish-crates:
    command: 'bash'
    args:
      - '-lc'
      - |
        set -o pipefail
        repo_root="$$(git rev-parse --show-toplevel)"
        mkdir -p "$${repo_root}/.moon/tmp"
        log_file="$$(mktemp "$${repo_root}/.moon/tmp/cargo-publish.XXXXXX.log")"
        cleanup() {
          rm -f "$${log_file}"
        }
        trap cleanup EXIT

        if cargo publish --locked 2>&1 | tee "$${log_file}"; then
          exit 0
        fi

        if grep -Eq '(crate .+ )?already exists on crates\.io index|already uploaded' "$${log_file}"; then
          echo 'Crate version already exists on crates.io, continuing.'
          exit 0
        fi

        exit 1
    options:
      cache: false
