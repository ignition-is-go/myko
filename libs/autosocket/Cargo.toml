[package]
name = "autosocket"
version = "4.24.3"
edition = "2024"
description = "Auto-reconnecting WebSocket transport adapters shared by myko clients"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ignition-is-go/myko"

[package.metadata.flux]
tasks = ["check", "build", "test", "lint", "publish", "check-wasm"]

[dependencies]
tracing.workspace = true
url.workspace = true
serde.workspace = true
ts-rs = { workspace = true, features = ["serde-json-impl"] }
hyphae.workspace = true
flume.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dashmap.workspace = true
tungstenite.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "WebSocket", "MessageEvent", "ErrorEvent", "CloseEvent",
    "BinaryType", "Window", "console",
] }
wasm-bindgen = "0.2"
js-sys = "0.3"
send_wrapper = "0.6"

[features]
default = []
# Umbrella for CI's `cargo test`/`clippy` runs (see flux.toml's `test` task).
# Nothing to gate here yet — declared so the flag resolves uniformly across
# every crate flux runs it against.
ci = []
