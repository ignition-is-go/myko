[workspace]

[package]
name = "myko-gpui-web-demo"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "myko-gpui-web-demo"
path = "main.rs"

[dependencies]
myko-gpui = { path = "../.." }
myko = { path = "../../../core", features = ["demo"] }
gpui = { package = "gpui-unofficial", version = "=1.16.1" }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.16.1" }

[profile.release]
codegen-units = 1
lto = "fat"
strip = "debuginfo"
