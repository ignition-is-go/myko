[package]
name = "myko-gpui"
publish = false
version = "6.2.0"
description = "Myko client bridge for GPUI, native and web"
license = "AGPL-3.0-or-later"
edition.workspace = true
authors.workspace = true
autoexamples = false

[package.metadata.flux]
tasks = ["check", "check-wasm", "build", "test", "lint"]

[dependencies]
serde.workspace = true
flume.workspace = true
myko = "6.0.0"
gpui.workspace = true
hyphae-gpui.workspace = true
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[dev-dependencies]
myko = { version = "6.0.0", features = ["demo"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[features]
default = []
ci = []

[lints]
workspace = true

[[example]]
name = "server_status"
path = "examples/server_status.rs"
