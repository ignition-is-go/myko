[package]
name = "myko-server"
version = "4.24.4"
edition = "2024"
description = "Myko server runtime — WebSocket, peer federation"
license = "AGPL-3.0-or-later"

[package.metadata.flux]
tasks = ["check", "build", "test", "lint", "publish"]

[dependencies]
# Internal
# myko-server instantiates `SearchIndex::new()` unconditionally, so it needs
# the real (tantivy-backed) implementation. Consumers that only use myko
# (e.g. entity crates) skip the tantivy compile by not pulling myko-server.
myko = { workspace = true, features = ["search"] }

# Async runtime
tokio.workspace = true
tokio-tungstenite.workspace = true
tungstenite.workspace = true
tokio-util.workspace = true

postgres = "0.19.13"

# Async utilities
futures-util.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
ciborium.workspace = true

# Misc
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
hyphae.workspace = true
inventory = "0.3.24"
dashmap.workspace = true
flume.workspace = true

# HTTP request-line parsing for the MCP front-door router
httparse = "1.9"

# Sandboxed JS execution for MCP "Code Mode" (execute() tool)
rquickjs = { version = "0.12", features = ["full-async", "parallel", "macro"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32.0", features = ["http-proto", "reqwest-blocking-client", "trace", "metrics"] }
tracing-opentelemetry = "0.33.0"

[dev-dependencies]
# Loopback integration test only — no TLS toolchain needed.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[features]
default = []
# Forward CPU profiling into myko-core. Opt-in (not default) so Windows/wasm
# consumers don't pull the unix-only pprof tree; enable explicitly for dev/profiling.
#
# NOTE(ts): this DOES pull in hyphae's own `profiling` feature, transitively
# via myko's (see libs/myko/core/Cargo.toml), and that is now the only way it
# reaches the build — it used to be forced on at the workspace `hyphae`
# dependency. Keep it off the default path: `profiling` adds `#[inline(never)]`
# on the fanout hot path and a per-fanout span that locks the cell-name mutex.
# hyphae's `trace`/`metrics` diagnostics are unaffected — those stay on for
# everyone at the workspace dependency, so the `trace` feature below is
# redundant-but-harmless and kept for explicitness.
profiling = ["myko/profiling"]
inspector = ["hyphae/inspector"]
trace = ['hyphae/trace']

# Umbrella for CI's `cargo test`/`clippy` runs (see flux.toml's `test` task).
# Excludes `inspector` deliberately: it spawns hyphae's inspector web server
# via `tokio::spawn` at startup, which needs an active Tokio runtime that
# plain `#[test]`s (e.g. `test_server_creation`) don't have — panics with
# "there is no reactor running" outside one. Not a CI-safe feature to
# blanket-enable; exercise it manually/in an async-runtime test instead.
ci = ["profiling", "trace"]
