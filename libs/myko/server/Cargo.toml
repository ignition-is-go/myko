[package]
name = "myko-server"
version = "4.19.0"
edition = "2024"
description = "Myko server runtime — WebSocket, peer federation"
license = "AGPL-3.0-or-later"

[package.metadata.flux]
tasks = ["check", "build", "test", "lint", "publish"]

[dependencies]
# Internal
# myko-server instantiates `SearchIndex::new()` unconditionally, so it needs
# the real (tantivy-backed) implementation. Consumers that only use myko
# (e.g. entity crates) skip the tantivy compile by not pulling myko-server.
myko = { workspace = true, features = ["search"] }

# Async runtime
tokio.workspace = true
tokio-tungstenite.workspace = true
tungstenite.workspace = true
tokio-util.workspace = true

postgres = "0.19.13"

# Async utilities
futures-util.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
ciborium.workspace = true

# Misc
uuid.workspace = true
chrono.workspace = true
log.workspace = true
hyphae.workspace = true
inventory = "0.3.24"
dashmap.workspace = true
flume.workspace = true

# HTTP request-line parsing for the MCP front-door router
httparse = "1.9"

[dev-dependencies]
# Loopback integration test only — no TLS toolchain needed.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[features]
default = []
# Forward CPU profiling into myko-core. Opt-in (not default) so Windows/wasm
# consumers don't pull the unix-only pprof tree; enable explicitly for dev/profiling.
profiling = ["myko/profiling"]
inspector = ["hyphae/inspector"]
trace = ['hyphae/trace']
