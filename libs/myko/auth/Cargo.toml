[package]
name = "myko-auth"
version = "6.16.0"
edition = "2024"
description = "Transport-independent authentication and local authorization for Myko"
license = "AGPL-3.0-or-later"

[package.metadata.flux]
tasks = ["check", "build", "test", "lint", "publish", "check-wasm"]

[lints]
workspace = true

[dependencies]
inventory = "0.3.24"
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
uuid.workspace = true
url = "2"
sha2 = "0.10"
base64 = "0.22"
ts-rs = { version = "12", optional = true, features = ["serde-compat", "no-serde-warnings"] }

[features]
ci = ["client"]
codegen-ts = ["dep:ts-rs"]
client = ["dep:oauth2", "dep:openidconnect", "dep:reqwest"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oauth2 = { version = "5", optional = true, default-features = false, features = ["reqwest", "rustls-tls"] }
openidconnect = { version = "4", optional = true, default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util"] }
