[package]
name = "myko-auth"
version = "6.11.6"
edition = "2024"
description = "Transport-independent authentication and local authorization for Myko"
license = "AGPL-3.0-or-later"

[package.metadata.flux]
tasks = ["check", "build", "test", "lint", "publish", "check-wasm"]

[lints]
workspace = true

[dependencies]
inventory = "0.3.24"
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
uuid.workspace = true

[features]
ci = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js"] }
