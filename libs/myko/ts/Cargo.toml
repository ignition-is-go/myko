[package]
name = "myko-ts"
version = "3.0.0-canary.809"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
myko-rs = { version = "3.0.0-canary.809", path = "../rs" }
napi = { version = "2.12.2", default-features = false, features = ["napi4", "async", "tokio_rt"] }
napi-derive = "2.12.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-signals = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[build-dependencies]
napi-build = "2.0.1"
