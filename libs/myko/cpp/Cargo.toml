[package]
name = "myko-cpp"
version = "3.1.0-canary.23"
edition = "2024"
description = "C++ bindings for myko-rs"
license = "AGPL-3.0-or-later"

# Keep this package independent from the main workspace
[workspace]

[lib]
name = "myko_cpp"
crate-type = ["staticlib"]

[dependencies]
myko-rs = { version = "4.0.0-canary.17", path = "../rs" }
cxx = "1.0"
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
serde_json = "1.0"
once_cell = "1.19"

[build-dependencies]
cxx-build = "1.0"