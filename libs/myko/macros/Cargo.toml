[package]
name = "myko-macros"
version = "6.5.0"
edition = "2024"
description = "myko macros"
license = "AGPL-3.0-or-later"
documentation = "https://docs.rs/myko-macros"

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.flux]
tasks = ["check", "build", "test", "lint", "publish"]

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
syn.workspace = true
quote.workspace = true

[features]
default = []
# Umbrella for CI's `cargo test`/`clippy` runs (see flux.toml's `test` task).
# Nothing to gate here yet — declared so the flag resolves uniformly across
# every crate flux runs it against.
ci = []
