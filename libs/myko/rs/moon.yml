$schema: "https://moonrepo.dev/schemas/project.json"

tasks:
  gen:
    command: "cargo"
    args:
      - "run"
      - "--bin"
      - "typegen"
    inputs:
      - "Cargo.toml"
      - "/Cargo.lock"
      - "src/**/*"
    outputs:
      - "bindings/**/*"
    options:
      cache: true

  clean:
    command: "bash"
    args:
      - "-lc"
      - |
        rm -rf bindings
    options:
      cache: false
      outputStyle: "stream"
