[package]
name = "myko-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["serde", "v4", "js"] } 
partially = {version = "0.2.1", features = ["derive"]}
futures-signals = "0.3.33"
futures-util = "0.3.30"
tokio = {version = "1.35.1", features = ["full"]}
tungstenite = "0.21.0"
tokio-tungstenite = { version = "0.21.0", features = ["native-tls"] }
async-trait = "0.1.77"
rdkafka = "0.36.2"
macros = {path = "../macros"}
openssl = { version = "0.10.35", features = ["vendored"] }
myko-wasm = {path="../wasm"}
rmp = "0.8.12"
rmp-serde = "1.1.2"
md5 = "0.7.0"
[dependencies.web-sys]
version = "0.3.22"
features = [
  "BinaryType",
  "Blob",
  "ErrorEvent",
  "FileReader",
  "MessageEvent",
  "ProgressEvent",
  "WebSocket",
]
