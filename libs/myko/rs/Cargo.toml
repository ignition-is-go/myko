[package]
name = "myko-rs"
version = "3.0.0-canary.809"
edition = "2024"
description = "myko in rust"
license = "AGPL-3.0-or-later"
documentation = "https://docs.rs/myko-rs"
homepage = "https://docs.rs/myko-rs"
repository = "https://github.com/ignition-is-go/rship"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["serde", "v4", "js"] }
partially = { version = "0.2.1", features = ["derive"] }
futures = "0.3"
futures-signals = "0.3.33"
futures-util = "0.3.30"
async-stream = "0.3"
tokio = { version = "1", features = ["full"] }
tungstenite = "0.21.0"
tokio-tungstenite = { version = "0.21.0", features = ["native-tls"] }
async-trait = "0.1.77"
rdkafka = {version = "0.36.2", features=["cmake-build"]}
myko-macros = { version= "3.0.0-canary.809", path = "../macros" }
openssl = { version = "0.10.35", features = ["vendored"] }
rmp = "0.8.12"
rmp-serde = "1.1.2"
md5 = "0.7.0"
tokio-util = "0.7.10"
tokio-stream = { version = "0.1.15", features = ["sync"] }
pin-project-lite = "0.2"
url = "2.5.0"
chrono = "0.4.39"
log = "0.4"
ractor = "0.15.9"
anyhow = "1.0.100"
autosocket = { version = "0.1.0", path = "../../autosocket" }
ts-rs = { version = "11.1.0", features = ["serde-json-impl"] }
inventory = "0.3.21"
dprint-plugin-typescript = "0.95.12"
tantivy = "0.22"

[features]
default = []
bench = []

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }

[[bench]]
name = "gateway"
harness = false
required-features = ["bench"]
