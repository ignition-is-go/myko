[package]
name = "myko-rs"
version = "0.1.5"
edition = "2021"
description = "myko in rust"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["serde", "v4", "js"] }
partially = { version = "0.2.1", features = ["derive"] }
futures-signals = "0.3.33"
futures-util = "0.3.30"
tokio = { version = "1", features = ["full"] }
tungstenite = "0.21.0"
tokio-tungstenite = { version = "0.21.0", features = ["native-tls"] }
async-trait = "0.1.77"
#rdkafka = {version = "0.36.2", features=["cmake-build"]}
myko-macros = { version= "^0.1.3", path = "../macros" }
openssl = { version = "0.10.35", features = ["vendored"] }
rmp = "0.8.12"
rmp-serde = "1.1.2"
md5 = "0.7.0"
tokio-util = "0.7.10"
tokio-stream = { version = "0.1.15", features = ["sync"] }
url = "2.5.0"
chrono = "0.4.39"
log = "0.4"
