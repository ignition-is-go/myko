[dependencies]
wasm-bindgen = "0.2.88"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["serde", "v4", "js"] }  # The version might change, please use the latest version
redis = "0.24.0"
partially = {version = "0.2.1", features = ["derive"]}
futures-signals = "0.3.33"
rxrust = "0.15.0"



[dependencies.web-sys]
version = "0.3.22"
features = [
  "BinaryType",
  "Blob",
  "ErrorEvent",
  "FileReader",
  "MessageEvent",
  "ProgressEvent",
  "WebSocket",
]
