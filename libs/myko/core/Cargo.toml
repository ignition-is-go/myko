[package]
name = "myko"
version = "6.5.4"
edition = "2024"
description = "myko in rust"
license = "AGPL-3.0-or-later"
documentation = "https://docs.rs/myko"
homepage = "https://docs.rs/myko"
repository = "https://github.com/ignition-is-go/myko"

[lints]
workspace = true

[package.metadata.flux]
tasks = ["check", "build", "test", "lint", "publish", "check-wasm"]

[dependencies]
num-traits.workspace = true
# Core deps (available on all targets)
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
futures.workspace = true
async-stream.workspace = true
async-trait.workspace = true
myko-macros.workspace = true
ciborium.workspace = true
erased-serde.workspace = true
pin-project-lite.workspace = true
url.workspace = true
chrono.workspace = true
anyhow.workspace = true
# Always-on span/event emission (myko.reduce, myko.command, etc. — see
# server/context.rs and core/command/handler.rs). This is how external
# profilers and tracers see what the server is doing; myko ships no
# in-process profiler of its own. Cheap enough with no subscriber attached
# that it doesn't need a compile-time feature gate — filtering is a runtime
# concern (RUST_LOG / an OTLP exporter), not a build-time one.
tracing.workspace = true
autosocket.workspace = true
ts-rs = { workspace = true, optional = true }
# Numeric newtype for foreign entity fields that need real ordering over
# floats (e.g. a downstream Keyframe's `position: OrderedFloat<f64>`).
# TypeScript support is activated only by the TypeScript codegen feature.
ordered-float = { version = "5", features = ["serde"], optional = true }
inventory = "0.3.24"
flume.workspace = true
hyphae.workspace = true
dashmap.workspace = true
ahash.workspace = true
parking_lot.workspace = true
# Per-type search index (typed module). Light deps; safe on wasm.
smallvec = "1.13"
roaring = "0.10"
nucleo-matcher = "0.3"
strsim = "0.11"
thread_local = "1.1"
opentelemetry = { version = "0.32.0", default-features = false, features = [
  "metrics",
] }

# Native-only deps (store, search, codegen)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Heavy deps gated behind features — see [features] below. Entity crates and
# downstream builds that don't need TS codegen can skip the swc/dprint tree.
dprint-plugin-typescript = { version = "0.95.15", optional = true }
crossbeam.workspace = true
# Native-only: rayon parallel scan over the typed search index. WASM falls
# back to serial scan (single-threaded execution model).
rayon = "1.10"

# WASM-only deps (minimal tokio for sync primitives, spawn/sleep helpers)
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window"] }
# uuid needs js feature for WASM RNG support
uuid = { version = "1", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }


[dev-dependencies]
ahash = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "dyn_vs_typed"
harness = false
required-features = ["bench"]

[[bench]]
name = "advanced_query_filters"
harness = false
required-features = ["bench"]

[[bench]]
name = "graph"
harness = false
required-features = ["bench"]

[features]
default = []
# Canonical domain used only by integration demos and examples. Keeping it
# opt-in prevents application-specific entities from entering Myko inventories
# or generated API surfaces in normal framework builds.
demo = []
bench = []
doc-gen = []
# Full-text entity search. Used to gate the tantivy backend; with tantivy
# replaced by the typed in-memory index, the feature now activates the real
# `SearchIndex` over the no-op stub. Kept as a feature so downstream crates
# (myko-server) opt in explicitly and so non-search builds — entity-only
# crates that just want types — continue to compile against the stub.
search = []
# Language-neutral type registration and module IR.
typegen = []
# Compile-time TypeScript adapter: derive support, export callbacks, renderer,
# formatter, and typegen/docgen binaries. Runtime/default Myko builds do not
# compile or link ts-rs or dprint.
codegen-ts = [
  "typegen",
  "dep:ts-rs",
  "dep:dprint-plugin-typescript",
  "ts-rs/serde-compat",
  "ts-rs/serde-json-impl",
  "ts-rs/chrono-impl",
  "ts-rs/uuid-impl",
  "ts-rs/no-serde-warnings",
  "ts-rs/ordered-float-impl",
]

# Instrument the reactive hot path for EXTERNAL profilers: hyphae's
# `#[inline(never)]` propagation boundaries (so samplers resolve
# notify/write_value/fanout as distinct frames instead of one folded symbol)
# plus its per-fanout `tracing` spans.
#
# NOTE(ts): myko deliberately ships no in-process profiler. There used to be
# StartProfile/StopProfile commands backed by a pprof sampler; a server that
# samples itself perturbs what it is measuring, and it cost ~1.4GB resident on
# first use (backtrace's global DWARF mapping cache — see the removal commit).
# Attach perf/samply/Tracy or a heap profiler instead. myko's own `tracing`
# spans (myko.reduce, myko.command, myko.query, myko.view, myko.report) are
# always-on and NOT gated by this feature, so external tooling can follow the
# work without turning anything on.
profiling = ["hyphae/profiling"]
# Filterable support for ordered_float::OrderedFloat<f32>/<f64> entity fields.
# The TypeScript adapter is enabled by `codegen-ts`, not this feature.
ordered-float = ["dep:ordered-float"]

# Umbrella for CI's `cargo test`/`clippy` runs: every feature that gates real
# behavior worth exercising, *except* `bench` — bench_entities/criterion are
# for local profiling, not routine CI (see flux.toml's `test` task).
ci = ["codegen-ts", "search", "profiling", "doc-gen", "ordered-float"]

# Typegen/docgen bins need the TypeScript adapter — declared explicitly so
# `cargo build -p myko` doesn't try to compile them without the feature.
[[bin]]
name = "typegen"
required-features = ["codegen-ts"]

[[bin]]
name = "docgen"
required-features = ["codegen-ts"]
