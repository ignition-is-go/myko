[package]
name = "myko"
version = "4.24.2"
edition = "2024"
description = "myko in rust"
license = "AGPL-3.0-or-later"
documentation = "https://docs.rs/myko"
homepage = "https://docs.rs/myko"
repository = "https://github.com/ignition-is-go/myko"


[package.metadata.flux]
tasks = ["check", "build", "test", "lint", "publish", "check-wasm"]

[dependencies]
# Core deps (available on all targets)
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
futures.workspace = true
async-stream.workspace = true
async-trait.workspace = true
myko-macros.workspace = true
ciborium.workspace = true
erased-serde.workspace = true
pin-project-lite.workspace = true
url.workspace = true
chrono.workspace = true
anyhow.workspace = true
# Always-on span/event emission (myko.reduce, myko.command, etc. — see
# server/context.rs and core/command/handler.rs). Cross-platform (unlike
# pprof), and cheap enough with no subscriber attached that it doesn't need
# a compile-time feature gate — filtering is a runtime concern (RUST_LOG /
# an OTLP exporter), not a build-time one.
tracing.workspace = true
autosocket.workspace = true
ts-rs = { workspace = true, features = ["serde-json-impl"] }
# Numeric newtype for foreign entity fields that need real ordering over
# floats (e.g. a downstream Keyframe's `position: OrderedFloat<f64>`) —
# optional since most consumers never touch it. See the `ordered-float`
# feature below, which forwards to ts-rs's own `ordered-float-impl` feature
# so `#[derive(TS)]` on a field of this type works when ts-export is on too.
ordered-float = { version = "5", features = ["serde"], optional = true }
inventory = "0.3.24"
flume.workspace = true
hyphae.workspace = true
dashmap.workspace = true
ahash.workspace = true
# Per-type search index (typed module). Light deps; safe on wasm.
smallvec = "1.13"
roaring = "0.10"
nucleo-matcher = "0.3"
strsim = "0.11"
thread_local = "1.1"
opentelemetry = { version = "0.32.0", default-features = false, features = [
  "metrics",
] }

# Native-only deps (store, search, codegen)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Heavy deps gated behind features — see [features] below. Entity crates and
# downstream builds that don't need TS codegen can skip the swc/dprint tree.
dprint-plugin-typescript = { version = "0.95.15", optional = true }
crossbeam.workspace = true
# Native-only: rayon parallel scan over the typed search index. WASM falls
# back to serial scan (single-threaded execution model).
rayon = "1.10"

# Unix-only deps. pprof relies on signal/pthread/ucontext APIs (via nix + libc)
# that don't exist on Windows, so it can only build on unix — not merely
# "native" (Windows-native would still fail to compile pprof).
[target.'cfg(unix)'.dependencies]
# Signal-based userspace CPU sampler (no perf_event_open → no sudo). Gated
# behind the `profiling` feature; only compiled for unix targets.
pprof = { version = "0.14", features = ["flamegraph"], optional = true }

# WASM-only deps (minimal tokio for sync primitives, spawn/sleep helpers)
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window"] }
# uuid needs js feature for WASM RNG support
uuid = { version = "1", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }


[dev-dependencies]
ahash = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "dyn_vs_typed"
harness = false
required-features = ["bench"]

[[bench]]
name = "advanced_query_filters"
harness = false
required-features = ["bench"]

[features]
default = []
bench = []
doc-gen = []
# TypeScript codegen (dprint-plugin-typescript + swc). Required only by the
# typegen/docgen binaries. Enabling this pulls ~8s of compile time onto the
# critical path via the swc parser tree.
codegen = ["dep:dprint-plugin-typescript", "ts-export"]
# Full-text entity search. Used to gate the tantivy backend; with tantivy
# replaced by the typed in-memory index, the feature now activates the real
# `SearchIndex` over the no-op stub. Kept as a feature so downstream crates
# (myko-server) opt in explicitly and so non-search builds — entity-only
# crates that just want types — continue to compile against the stub.
search = []
# When enabled, myko's proc-macros emit `#[derive(ts_rs::TS)]` and keep
# `#[ts(...)]` field attributes. Off by default — entity crates compile
# ~319 fewer `impl TS for _` blocks each, saving meaningful time in the
# entity-crate fan-out phase. Activated transitively by `codegen` (typegen
# needs the TS impls) and propagated through entity crates via their own
# `ts-export` feature forwards (see downstream entity-crate umbrellas).
ts-export = []
# In-process CPU profiling (StartProfile/StopProfile commands + profile() helper).
# Pulls the unix-only pprof sampler — no-op on non-unix targets (wasm32,
# Windows), where the dep doesn't apply — enabling the feature there compiles
# to a stub that reports "profiling not enabled" rather than failing the
# build. `tracing` spans (myko.reduce, myko.command, etc.) are always-on now
# and not gated by this feature — see the `tracing` dependency comment above.
profiling = ["dep:pprof"]
# Filterable + TS support for ordered_float::OrderedFloat<f32>/<f64> entity
# fields. Optional because most consumers never have a float field that
# needs total ordering — a plain f32/f64 field already gets NumericFilter
# via the built-in impl_numeric_filterable! instantiations above.
ordered-float = ["dep:ordered-float", "ts-rs/ordered-float-impl"]

# Umbrella for CI's `cargo test`/`clippy` runs: every feature that gates real
# behavior worth exercising, *except* `bench` — bench_entities/criterion are
# for local profiling, not routine CI (see flux.toml's `test` task).
ci = ["codegen", "search", "ts-export", "profiling", "doc-gen", "ordered-float"]

# Typegen/docgen bins need the codegen feature — declared explicitly so
# `cargo build -p myko` doesn't try to compile them without the feature.
[[bin]]
name = "typegen"
required-features = ["codegen"]

[[bin]]
name = "docgen"
required-features = ["codegen"]
