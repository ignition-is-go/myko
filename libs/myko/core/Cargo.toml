[package]
name = "myko"
version = "4.10.0"
edition = "2024"
description = "myko in rust"
license = "AGPL-3.0-or-later"
documentation = "https://docs.rs/myko"
homepage = "https://docs.rs/myko"
repository = "https://github.com/ignition-is-go/myko"


[package.metadata.flux]
tasks = ["check", "build", "test", "lint", "publish"]

[dependencies]
# Core deps (available on all targets)
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
partially.workspace = true
futures.workspace = true
async-stream.workspace = true
async-trait.workspace = true
myko-macros.workspace = true
ciborium.workspace = true
erased-serde.workspace = true
pin-project-lite.workspace = true
url.workspace = true
chrono.workspace = true
log.workspace = true
anyhow.workspace = true
autosocket.workspace = true
ts-rs = { workspace = true, features = ["serde-json-impl"] }
inventory = "0.3.24"
flume.workspace = true
hyphae.workspace = true
dashmap.workspace = true

# Native-only deps (store, search, codegen)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Heavy deps gated behind features — see [features] below. Entity crates and
# downstream builds that don't need TS codegen or full-text search can skip
# the swc/dprint tree (codegen) and the tantivy tree (search) entirely.
dprint-plugin-typescript = { version = "0.95.15", optional = true }
tantivy = { version = "0.22", optional = true }
crossbeam.workspace = true

# WASM-only deps (minimal tokio for sync primitives, spawn/sleep helpers)
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window"] }
# uuid needs js feature for WASM RNG support
uuid = { version = "1", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }


[features]
default = []
bench = []
doc-gen = []
# TypeScript codegen (dprint-plugin-typescript + swc). Required only by the
# typegen/docgen binaries. Enabling this pulls ~8s of compile time onto the
# critical path via the swc parser tree.
codegen = ["dep:dprint-plugin-typescript", "ts-export"]
# Full-text entity search (tantivy). Required by myko-server's SearchIndex.
# When disabled, `SearchIndex` is a no-op stub and `ReportContext::search`
# returns empty results, so downstream crates compile unchanged.
search = ["dep:tantivy"]
# When enabled, myko's proc-macros emit `#[derive(ts_rs::TS)]` and keep
# `#[ts(...)]` field attributes. Off by default — entity crates compile
# ~319 fewer `impl TS for _` blocks each, saving meaningful time in the
# entity-crate fan-out phase. Activated transitively by `codegen` (typegen
# needs the TS impls) and propagated through entity crates via their own
# `ts-export` feature forwards (see rship-entities umbrella).
ts-export = []

# Typegen/docgen bins need the codegen feature — declared explicitly so
# `cargo build -p myko` doesn't try to compile them without the feature.
[[bin]]
name = "typegen"
required-features = ["codegen"]

[[bin]]
name = "docgen"
required-features = ["codegen"]
