[tasks.check-relationships]
root = ["cargo", "clippy", "-p", "myko", "--jobs", "4", "--target-dir", "target/agent", "--lib", "--tests", "--no-deps", "--", "-D", "warnings"]

[tasks.benchmark-startup-relationships]
