[package]
name = "myko-authority"
version = "7.0.0-alpha.1"
edition.workspace = true
description = "Durable, entity-native authority service for Myko 7"
license = "AGPL-3.0-or-later"

[lints]
workspace = true

[features]
schema = ["dep:schemars", "myko/schema"]

[dependencies]
schemars = { workspace = true, optional = true }
chrono.workspace = true
ed25519-dalek = "3.0.0"
flume.workspace = true
hyphae.workspace = true
myko.workspace = true
myko-federation.workspace = true
myko-items.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
myko-iroh.workspace = true
myko-local.workspace = true
myko-node.workspace = true
myko-redb.workspace = true
myko-wire.workspace = true
tempfile = "3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
