[workspace]
resolver = "2"
default-members = [
  "libs/myko/app",
  "libs/myko/app-macros",
  "libs/myko/discovery",
  "libs/myko/wire",
  "libs/myko/federation",
  "libs/myko/items",
  "libs/myko/items-macros",
  "libs/myko/iroh",
  "libs/myko/local",
  "libs/myko/node",
  "libs/myko/ratatui",
  "libs/myko/swift",
  "libs/myko/redb",
  "libs/myko/session",
]
members = [
  "apps/docs-site",
  "libs/myko/app",
  "libs/myko/app-macros",
  "libs/myko/discovery",
  "libs/myko/core",
  "libs/myko/federation",
  "libs/myko/items",
  "libs/myko/items-macros",
  "libs/myko/websocket-gateway",
  "libs/myko/iroh",
  "libs/myko/local",
  "libs/myko/node",
  "libs/myko/ratatui",
  "libs/myko/swift",
  "libs/myko/redb",
  "libs/myko/session",
  "libs/myko/macros",
  "libs/myko/server",
  "libs/myko/leptos",
  "libs/myko/gpui",
  "libs/autosocket",
]

[workspace.package]
version = "6.0.0"
edition = "2024"
authors = ["Trevor"]
license = "MIT OR Apache-2.0"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
disallowed_types = "deny"
# DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[workspace.dependencies]
num-traits = "0.2"
# Core async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
ciborium = "0.2"
erased-serde = "0.4"

# Async utilities
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
futures-util = "0.3"
pin-project-lite = "0.2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "2"

# Typed layered application configuration
confique = "0.4"

# Logging/tracing
tracing = "0.1"

# Time/UUID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.23", features = ["v4", "v5", "v7", "serde"] }

# WebSocket
tungstenite = "0.29"
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }

# Proc macros
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

# Type generation
ts-rs = "12.0.1"
uniffi = { version = "0.32", default-features = false }

# Misc utilities
url = "2.5"
crossbeam = "0.8"
flume = "0.11"
dashmap = "6.1.0"
ahash = "0.8"
parking_lot = "0.12"

# The scheduler is required by Myko's batched store propagation. Keep the
# Leptos adapter on the same Hyphae major so its extension traits share types.
hyphae = { version = "^3.1", features = ["scheduler"] }
hyphae-leptos = { version = "^3.1" }
# Pin the published bridge so Myko and Hyphae share one GPUI type universe.
hyphae-gpui = "=3.1.2"
iroh = "1.1"

# GPUI native/web stack. Pin the unofficial packages so every adapter shares one type universe.
gpui = { package = "gpui-unofficial", version = "=1.16.1" }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.16.1" }

# Internal crates
autosocket = { version = "6.5.10", path = "libs/autosocket" }
myko-gpui = { version = "6.5.10", path = "libs/myko/gpui" }
myko-leptos = { version = "6.5.10", path = "libs/myko/leptos" }
myko-macros = { version = "6.5.10", path = "libs/myko/macros" }
myko = { version = "6.5.10", path = "libs/myko/core" }
myko-app = { version = "7.0.0-alpha.1", path = "libs/myko/app" }
myko-app-macros = { version = "7.0.0-alpha.1", path = "libs/myko/app-macros" }
myko-discovery = { version = "7.0.0-alpha.1", path = "libs/myko/discovery" }
myko-wire = { version = "7.0.0-alpha.1", path = "libs/myko/wire" }
myko-federation = { version = "7.0.0-alpha.1", path = "libs/myko/federation" }
myko-items = { version = "7.0.0-alpha.1", path = "libs/myko/items" }
myko-items-macros = { version = "7.0.0-alpha.1", path = "libs/myko/items-macros" }
myko-iroh = { version = "7.0.0-alpha.1", path = "libs/myko/iroh" }
myko-local = { version = "7.0.0-alpha.1", path = "libs/myko/local" }
myko-node = { version = "7.0.0-alpha.1", path = "libs/myko/node" }
myko-ratatui = { version = "7.0.0-alpha.1", path = "libs/myko/ratatui" }
myko-swift = { version = "7.0.0-alpha.1", path = "libs/myko/swift" }
myko-redb = { version = "7.0.0-alpha.1", path = "libs/myko/redb" }
myko-session = { version = "7.0.0-alpha.1", path = "libs/myko/session" }
myko-websocket-gateway = { version = "7.0.0-alpha.1", path = "libs/myko/websocket-gateway" }
myko-server = { version = "6.5.10", path = "libs/myko/server" }

[patch.crates-io]
# Test the Git-distributed GPUI bridge against this workspace's Myko core.
# Downstream consumers ignore dependency-owned patches and use crates.io.
myko = { path = "libs/myko/core" }
