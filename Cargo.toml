[workspace]
resolver = "2"
members = [
  "libs/myko/core",
  "libs/myko/macros",
  "libs/myko/server",
  "libs/myko/leptos",
  "libs/myko/gpui",
  "libs/autosocket",
]

[workspace.package]
version = "6.0.0"
edition = "2024"
authors = ["Trevor"]
license = "MIT OR Apache-2.0"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
disallowed_types = "deny"
# DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[workspace.dependencies]
num-traits = "0.2"
# Core async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
ciborium = "0.2"
erased-serde = "0.4"

# Async utilities
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
futures-util = "0.3"
pin-project-lite = "0.2"

# Error handling
anyhow = "1.0"

# Typed layered application configuration
confique = "0.4"

# Logging/tracing
tracing = "0.1"

# Time/UUID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.23", features = ["v4", "v5", "serde"] }

# WebSocket
tungstenite = "0.29"
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }

# Proc macros
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

# Type generation
ts-rs = "12.0.1"

# Misc utilities
url = "2.5"
crossbeam = "0.8"
flume = "0.11"
dashmap = "6.1.0"
ahash = "0.8"
parking_lot = "0.12"

# The scheduler is required by Myko's batched store propagation. Keep the
# Leptos adapter on the same Hyphae major so its extension traits share types.
hyphae = { version = "^3.0", features = ["scheduler"] }
hyphae-leptos = { version = "^3.0" }
# Pin the published bridge so Myko and Hyphae share one GPUI type universe.
hyphae-gpui = "=3.1.2"

# GPUI native/web stack. Pin the unofficial packages so every adapter shares one type universe.
gpui = { package = "gpui-unofficial", version = "=1.16.1" }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.16.1" }

# Internal crates
autosocket = { version = "6.5.7", path = "libs/autosocket" }
myko-gpui = { version = "6.5.7", path = "libs/myko/gpui" }
myko-leptos = { version = "6.5.7", path = "libs/myko/leptos" }
myko-macros = { version = "6.5.7", path = "libs/myko/macros" }
myko = { version = "6.5.7", path = "libs/myko/core" }
myko-server = { version = "6.5.7", path = "libs/myko/server" }

[patch.crates-io]
# Test the Git-distributed GPUI bridge against this workspace's Myko core.
# Downstream consumers ignore dependency-owned patches and use crates.io.
myko = { path = "libs/myko/core" }
