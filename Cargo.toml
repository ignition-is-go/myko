[workspace]
resolver = "2"
members = [
  "libs/myko/core",
  "libs/myko/macros",
  "libs/myko/server",
  "libs/myko/leptos",
  "libs/autosocket",
]

[workspace.package]
version = "4.24.1"
edition = "2024"
authors = ["Trevor"]
license = "MIT OR Apache-2.0"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[workspace.lints.clippy]
disallowed_types = "deny"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
ciborium = "0.2"
erased-serde = "0.4"

# Async utilities
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
futures-util = "0.3"
pin-project-lite = "0.2"

# Error handling
anyhow = "1.0"

# Logging/tracing
tracing = "0.1"

# Time/UUID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.23", features = ["v4", "v5", "serde"] }

# WebSocket
tungstenite = "0.29"
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }

# Proc macros
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

# Type generation
ts-rs = "11.1"

# Misc utilities
url = "2.5"
crossbeam = "0.8"
flume = "0.11"
dashmap = "6.1.0"
ahash = "0.8"
partially = { version = "0.2", features = ["derive"] }

# `scheduler` is effectively required: myko's store-diff apply opens a hyphae
# `batch()` boundary, and downstream event-semantic subgraphs rely on the
# `no_coalesce` opt-out it provides. `profiling` backs the pass()/
# take_report() A/B measurement instrumentation on that same seam (without it,
# PassReport.per_cell is always empty — record_fire is gated behind it in
# hyphae's Cell::fanout). Enabled here so both reach every downstream crate
# via feature unification.
#
# 1.2.0 is the first published release with `scheduler`/`profiling` (feat/
# scheduler merged to main, released via hyphae's own CI). Back to a version
# dependency now that it's out.
#
# 1.3.0 moves the scheduler's tick queue from per-thread to process-wide with
# rayon-backed wave-parallel draining for wide same-height fan-out (feat/
# scheduler-wave-parallel, hyphae PR #12) — see the query_cache_leak_test.rs
# serialization fix landed alongside this bump for why that mattered here.
#
# 1.3.1 fixes a SubscriberRegistry::remove bug (hyphae PR #13): unsubscribe
# left the just-removed subscriber pinned in the cached notify snapshot until
# the next notify rebuilt it, so a cell that's superseded and never notified
# again (e.g. a switch_map inner's diffs_cell) leaked everything the pinned
# closure held alive. That's what caused query_cache_leak_test's two
# remaining failures — myko's query cache itself was clean.
hyphae = { version = "^1.3.1", features = ["scheduler", "profiling"] }
hyphae-leptos = { version = "^1.1.0" }

# Internal crates
autosocket = { version = "4.24.1", path = "libs/autosocket" }
myko-leptos = { version = "4.24.1", path = "libs/myko/leptos" }
myko-macros = { version = "4.24.1", path = "libs/myko/macros" }
myko = { version = "4.24.1", path = "libs/myko/core" }
myko-server = { version = "4.24.1", path = "libs/myko/server" }
