[workspace]
resolver = "2"
members = [
  "libs/myko/core",
  "libs/myko/macros",
  "libs/myko/server",
  "libs/myko/leptos",
  "libs/autosocket",
]

[workspace.package]
version = "4.2.1-canary.5"
edition = "2024"
authors = ["Trevor"]
license = "MIT OR Apache-2.0"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[workspace.lints.clippy]
disallowed_types = "deny"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rmp-serde = "1.3"
erased-serde = "0.4"

# Async utilities
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
futures-util = "0.3"
pin-project-lite = "0.2"

# Error handling
anyhow = "1.0"

# Logging
log = "0.4"

# Time/UUID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.23", features = ["v4", "serde"] }

# WebSocket
tungstenite = "0.29"
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }

# Proc macros
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

# Type generation
ts-rs = "11.1"

# Misc utilities
url = "2.5"
crossbeam = "0.8"
flume = "0.11"
dashmap = "6.1.0"
partially = { version = "0.2", features = ["derive"] }

hyphae = { version = "^0.5.1" }

# Internal crates
autosocket = { version = "4.2.1-canary.5", path = "libs/autosocket" }
myko-leptos = { version = "4.2.1-canary.5", path = "libs/myko/leptos" }
myko-macros = { version = "4.2.1-canary.5", path = "libs/myko/macros" }
myko = { version = "4.2.1-canary.5", path = "libs/myko/core" }
myko-server = { version = "4.2.1-canary.5", path = "libs/myko/server" }
