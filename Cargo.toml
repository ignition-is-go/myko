[workspace]
resolver = "2"
members = [
  "libs/myko/core",
  "libs/myko/macros",
  "libs/myko/server",
  "libs/myko/leptos",
  "libs/autosocket",
]

[workspace.package]
version = "4.24.4"
edition = "2024"
authors = ["Trevor"]
license = "MIT OR Apache-2.0"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[workspace.lints.clippy]
disallowed_types = "deny"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
ciborium = "0.2"
erased-serde = "0.4"

# Async utilities
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
futures-util = "0.3"
pin-project-lite = "0.2"

# Error handling
anyhow = "1.0"

# Logging/tracing
tracing = "0.1"

# Time/UUID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.23", features = ["v4", "v5", "serde"] }

# WebSocket
tungstenite = "0.29"
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }

# Proc macros
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

# Type generation
ts-rs = "11.1"

# Misc utilities
url = "2.5"
crossbeam = "0.8"
flume = "0.11"
dashmap = "6.1.0"
ahash = "0.8"
partially = { version = "0.2", features = ["derive"] }

# `scheduler` is effectively required: myko's store-diff apply opens a hyphae
# `batch()` boundary, and downstream event-semantic subgraphs rely on the
# `no_coalesce` opt-out it provides.
#
# `trace` (=> `metrics`) is kept on for everyone deliberately: it backs the
# per-cell registry that gives a live-cell census in production, which is what
# made the 2026-07 rship leak attributable at all. It is not free — a registry
# entry + `Location::caller()` String per cell, an Arc<CellMetrics> + 2
# ArcSwaps per cell, a DashMap write per notify; 0.63GB at a 21GB plateau
# (~1.6M live cells) on the production rack. That cost is accepted; the
# registry is drop-symmetric and bounded by live cells, so it is a constant
# multiplier, not growth.
#
# `profiling` is deliberately NOT here — it is the strict superset that adds
# hot-path cost with no diagnostic value we rely on: `#[inline(never)]` on
# notify/write_value/fanout, plus a per-fanout `tracing` span that locks the
# cell-name mutex. Cargo features are additive and unify across the graph, so
# listing it here forced it on every consumer's release build with no way to
# opt out. It now rides myko's own `profiling` feature (which needs it for
# pass()/take_report() in context.rs) — see libs/myko/core/Cargo.toml.
# (rship lv-1a3f)
#
# 1.2.0 is the first published release with `scheduler`/`profiling` (feat/
# scheduler merged to main, released via hyphae's own CI). Back to a version
# dependency now that it's out.
#
# 1.3.0 moves the scheduler's tick queue from per-thread to process-wide with
# rayon-backed wave-parallel draining for wide same-height fan-out (feat/
# scheduler-wave-parallel, hyphae PR #12) — see the query_cache_leak_test.rs
# serialization fix landed alongside this bump for why that mattered here.
#
# 1.3.1 fixes a SubscriberRegistry::remove bug (hyphae PR #13): unsubscribe
# left the just-removed subscriber pinned in the cached notify snapshot until
# the next notify rebuilt it, so a cell that's superseded and never notified
# again (e.g. a switch_map inner's diffs_cell) leaked everything the pinned
# closure held alive. That's what caused query_cache_leak_test's two
# remaining failures — myko's query cache itself was clean.
#
# 1.3.3 carries hyphae's own scheduler wins (whole-server output freeze fix
# via localized height-cache invalidation, idle-CPU fix, timer co-due
# ordering fix) — myko's own consumers benefit directly, so floor is bumped
# to it deliberately rather than trailing behind.
#
# CountAll*/Count* reports returning 0 (or freezing at a stale count) traced
# to hyphae's CellMap::size(): unlike entries()/items()/subscribe_diffs, it
# returns a bare clone of the map's internal len_cell without capturing the
# parent CellMapInner's keepalive, so a caller that doesn't separately hold
# the source map — exactly myko's generated CountAll compute, previously —
# gets a `len_cell` whose upstream store subscription can drop out from
# under it once the local chain inside compute() goes out of scope. Fixed
# on myko's side (see `libs/myko/macros/src/item.rs`) by capturing the
# source map in the count cell's own closure. Confirmed pre-existing back
# to 1.3.1, not something the 1.3.3 bump introduced.
#
# 1.3.4 makes size() self-retaining hyphae-side too (defense-in-depth on
# top of myko's own fix) — floor bumped to pick it up.
hyphae = { version = "^1.3.4", features = ["scheduler", "trace"] }
hyphae-leptos = { version = "^1.1.0" }

# Internal crates
autosocket = { version = "4.24.4", path = "libs/autosocket" }
myko-leptos = { version = "4.24.4", path = "libs/myko/leptos" }
myko-macros = { version = "4.24.4", path = "libs/myko/macros" }
myko = { version = "4.24.4", path = "libs/myko/core" }
myko-server = { version = "4.24.4", path = "libs/myko/server" }
