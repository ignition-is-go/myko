  "apps/linkd",
  "apps/rship_mcp",
  "apps/server_rs",
  "apps/sync_server",
  "libs/myko/rs",
  "libs/myko/macros",
  "libs/link/core",
  "libs/link/rpc/rs",
  "libs/entities/foundation",
  "libs/entities/core",
  "libs/entities/tags",
  "libs/entities/teams",
  "libs/entities/machine",
  "libs/entities/physical",
  "libs/entities/link",
  "libs/entities/audit",
  "libs/entities/status",
  "libs/entities/runtime",
  "libs/entities/external",
  "libs/entities/assignment",
  "libs/entities/feedback",
  "libs/entities/variables",
  "libs/entities/timing",
  "libs/entities/scheduling",
  "libs/entities/nmos",
  "libs/entities/networking",
  "libs/entities/assets",
  "libs/entities/media",
  "libs/entities/infrastructure",
  "libs/entities/sequencing",
  "libs/entities/visualization",
  "libs/entities/vfx",
  "libs/entities/lighting",
  "libs/entities/color",
  "libs/entities/compositing",
  "libs/entities/rive",
  "libs/entities/cameras",
  "libs/entities/surfaces",
  "libs/entities/ui",
  "libs/entities/nodes",
  "libs/entities/math",
  "libs/entities/logic",
  "libs/entities/lists",
  "libs/entities/objects",
  "libs/entities/string",
  "libs/entities/generators",
  "libs/entities/rs",
  "libs/entities/macros",
  "libs/sdk/rs",
  "libs/rs-macros",
  "libs/sync",
  "libs/opencv",
  "libs/asset-store/core",
  "libs/autosocket",
  "libs/hypha/hypha",
  "libs/display/core",
  "libs/display/output",
  "libs/display/nvidia",
  "tools/gen-executor",
  # Executors
  "apps/execs/osc",
  "apps/execs/http",
  "apps/execs/mqtt",
  "apps/execs/serial-port",
  "apps/execs/ltc-timecode",
  "apps/execs/mtc-timecode",
  "apps/execs/qlab",
  "apps/execs/disguise",
  "apps/execs/eos",
  "apps/execs/ptp",
  "apps/execs/atem",
  "apps/execs/vmix",
  "apps/execs/resolume",
  "apps/execs/visca",
  "apps/execs/freed",
  "apps/execs/brompton",
  "apps/execs/qsys",
  "apps/execs/natnet",
  "apps/execs/reaper",
  "apps/execs/novastar",
  "apps/execs/crestron",
  "apps/execs/yamaha",
  "apps/execs/digico",
  "apps/execs/extron",
  "apps/execs/amx",
  "apps/execs/brightsign",
  "apps/execs/weather",
  "apps/execs/pangolin",
  "apps/execs/ndi",
  "apps/execs/dante",
  "apps/execs/nmos",
  "apps/execs/network-discovery",
  # Node Agent
  "apps/node-agent",
  # Tools
  "tools/release",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Trevor"]
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
disallowed_types = "deny"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rmp = "0.8"
rmp-serde = "1.1"

# Async utilities
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
futures-util = "0.3"
pin-project-lite = "0.2"

# Error handling
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"

# Time/UUID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.13", features = ["v4", "serde"] }

# WebSocket
tungstenite = "0.21"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

# Actor framework
ractor = "0.15"

# Proc macros
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

# Type generation
ts-rs = "11.1"

# Misc utilities
url = "2.5"
crossbeam = "0.8"
flume = "0.11"
arc-swap = "1.7.1"
dashmap = "6.1.0"
futures-core = "0.3"
ordered-float = { version = "5.1", features = ["serde"] }
partially = { version = "0.2", features = ["derive"] }
regex = "1"
dotenv = "0.15"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Node.js bindings
napi = { version = "2.12", default-features = false, features = ["napi4", "async"] }
napi-derive = "2.12"
napi-build = "2.0"

# Internal crates
myko-rs = { version = "3.1.0-canary.23", path = "libs/myko/rs" }
myko-macros = { version = "3.1.0-canary.23", path = "libs/myko/macros" }
rship-entities = { version = "3.1.0-canary.23", path = "libs/entities/rs" }
