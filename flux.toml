[channels]
main = "production"
dev = { channel = "canary", prerelease = true }

[tasks.check]
workspace_batchable = true
depends_on = ["gen"]
cargo = ["cargo", "check", "--target-dir", "target/claude"]
bun = ["bun", "run", "check"]

[tasks.build]
workspace_batchable = true
depends_on = ["gen"]
cargo = ["cargo", "build"]
bun = ["bun", "run", "build"]

[tasks.test]
workspace_batchable = true
cargo = ["cargo", "test"]
bun = ["bun", "test"]

[tasks.lint]
cargo = ["cargo", "clippy", "--all-targets", "--all-features", "--", "-D", "warnings"]
bun = ["bun", "run", "lint"]

[tasks.gen]
default = ["cargo", "run", "-p", "myko", "--bin", "typegen", "--", "src/generated"]

[tasks.publish]
cascade = "all"
autoapply = "inherit"
depends_on = ["gen"]
cargo = ["cargo", "publish"]
bun = """BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "dev") \
  && if [ "$BRANCH" = "main" ]; then TAG=latest; else TAG=canary; fi \
  && npm publish --provenance --access public --tag "$TAG" """
