[channels]
main = "production"
dev = { channel = "canary", prerelease = true }

[tasks.check]
workspace_batchable = true
depends_on = ["gen"]
cargo = ["cargo", "check", "--target-dir", "target/claude"]
bun = ["bun", "run", "check"]

[tasks.build]
workspace_batchable = true
depends_on = ["gen"]
cargo = ["cargo", "build"]
bun = ["bun", "run", "build"]

[tasks.test]
workspace_batchable = true
# `ci` is a per-crate umbrella feature (see each crate's Cargo.toml) covering
# everything worth exercising in CI except `bench` — bench_entities/criterion
# are for local profiling, not routine CI.
cargo = ["cargo", "test", "--features", "ci"]
bun = ["bun", "test"]

[tasks.lint]
cargo = ["cargo", "clippy", "--all-targets", "--features", "ci", "--", "-D", "warnings"]
bun = ["bun", "run", "lint"]

[tasks.check-wasm]
# wasm32 coverage for the crates that actually ship to a browser/wasm target
# (myko, autosocket, myko-leptos — see each crate's `[package.metadata.flux]`
# tasks list; myko-server/myko-macros don't opt in since they're host-only).
# `check` alone doesn't exercise `#[cfg(target_arch = "wasm32")]` code paths,
# so a break there passes native CI silently without this.
workspace_batchable = true
cargo = ["cargo", "check", "--target", "wasm32-unknown-unknown", "--target-dir", "target/claude"]

[tasks.gen]
default = ["cargo", "run", "-p", "myko", "--features", "codegen", "--bin", "typegen", "--", "src/generated"]

[tasks.publish]
cascade = "all"
autoapply = "inherit"
depends_on = ["build"]
cargo = ["cargo", "publish"]
bun = """cp package.json package.json.bak \
  && bun "$(git rev-parse --show-toplevel)/scripts/apply-publish-config.ts" \
  && VERSION=$(bun -p "require('./package.json').version") \
  && if echo "$VERSION" | grep -q '-'; then TAG=canary; else TAG=latest; fi \
  && npm publish --provenance --access public --tag "$TAG" ; mv package.json.bak package.json"""
