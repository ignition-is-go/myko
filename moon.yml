$schema: 'https://moonrepo.dev/schemas/project.json'

tasks:
  clean:
    command: './tools/scripts/clean-artifacts.sh'
    options:
      cache: false
      outputStyle: 'stream'

  install:
    options:
      cache: false
      outputStyle: 'stream'
    command: 'bun'
    args: ['install']

  check:
    options:
      cache: false
      outputStyle: 'stream'
    command: 'cargo'
    args: ['check']

  test:
    options:
      cache: false
      outputStyle: 'stream'
    command: 'cargo'
    args: ['test']
