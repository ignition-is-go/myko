$schema: 'https://moonrepo.dev/schemas/project.json'
tasks:
  install:
    options:
      cache: false
    command: 'bun'
    args: ['install']
  check:
    options:
      cache: false
    command: 'cargo'
    args: ['check']
  test:
    options:
      cache: false
    command: 'cargo'
    args: ['test']
