$schema: 'https://moonrepo.dev/schemas/project.json'
tasks:
  clean:
    command: './tools/scripts/clean-artifacts.sh'
    options:
      cache: false
  install:
    options:
      cache: false
    command: 'bun'
    args: ['install']
  check:
    options:
      cache: false
    command: 'cargo'
    args: ['check']
  test:
    options:
      cache: false
    command: 'cargo'
    args: ['test']
  live:
    options:
      cache: false
      runFromWorkspaceRoot: true
    env:
      CHANNEL: 'live'
    command: 'bunx'
    args:
      - '@moonrepo/cli'
      - 'run'
      - ':publish'
