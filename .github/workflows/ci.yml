name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2

      - run: bun install
      - run: cargo install cargo-flux
      - run: cargo flux run check
      - run: cargo flux run lint
      - run: cargo flux run test

      # wasm32 coverage for myko/autosocket/myko-leptos — the crates that
      # actually ship to a browser/wasm target (see each crate's
      # `[package.metadata.flux]` tasks list). `check` alone only exercises
      # the native target, so a break in `#[cfg(target_arch = "wasm32")]`
      # code (e.g. a downstream Tauri/trunk-build pipeline that compiles the
      # leptos UI to wasm32-unknown-unknown and pulls myko in transitively)
      # would otherwise pass CI silently.
      - run: cargo flux run check-wasm
