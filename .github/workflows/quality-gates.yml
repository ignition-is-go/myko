name: Quality gates

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native quality gates
    runs-on: ci-public-linux-ephemeral
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ignition-is-go/pulse-actions/actions/setup-rust@2c94ebf4fedd47f0c36d491e0dee5ad446a071b5 # v1.0.0
        with:
          components: rustfmt, clippy
          cache-shared-key: ci-native
          compiler-cache-endpoint: ${{ secrets.CI_CACHE_ENDPOINT }}
          compiler-cache-bucket: ${{ secrets.CI_CACHE_BUCKET }}
          compiler-cache-access-key: ${{ secrets.CI_CACHE_ACCESS_KEY }}
          compiler-cache-secret-key: ${{ secrets.CI_CACHE_SECRET_KEY }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install GPUI Linux dependencies
        run: |
          sudo sed -i 's|http://|https://|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev
      - run: bun install --frozen-lockfile
      - name: Check for cargo-binstall
        id: cargo-binstall
        shell: bash
        run: |
          if command -v cargo-binstall >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install cargo-binstall
        if: steps.cargo-binstall.outputs.available != 'true'
        uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1
        with:
          version: "1.21.1"
      - name: Install or update cargo-flux
        run: cargo binstall cargo-flux --no-confirm --force
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust and generated TypeScript
        run: cargo flux run check
      - name: Run strict Clippy and frontend lint
        run: cargo flux run lint
      - name: Run Rust and frontend tests
        env:
          RUST_TEST_THREADS: 1
        run: cargo flux run test
      - name: Verify myko-gpui is publishable
        run: cargo publish --dry-run --locked --allow-dirty -p myko-gpui
      - name: Test typegen renderer and macro defaults
        run: |
          cargo test -p myko --lib --features codegen-ts codegen::typescript::
          cargo test -p myko-macros --lib
      - name: Check feature boundaries
        run: |
          cargo check --workspace --all-targets --no-default-features
          cargo check -p myko --all-targets --no-default-features --features typegen
          cargo check -p myko --all-targets --no-default-features --features codegen-ts
          cargo check -p myko-server --all-targets --no-default-features
      - uses: ignition-is-go/pulse-actions/actions/report-resources@2c94ebf4fedd47f0c36d491e0dee5ad446a071b5 # v1.0.0
        if: always()

  wasm:
    name: WebAssembly check
    runs-on: ci-public-linux-ephemeral
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ignition-is-go/pulse-actions/actions/setup-rust@2c94ebf4fedd47f0c36d491e0dee5ad446a071b5 # v1.0.0
        with:
          targets: wasm32-unknown-unknown
          linux-dependencies: build
          cache-shared-key: ci-wasm
          compiler-cache-endpoint: ${{ secrets.CI_CACHE_ENDPOINT }}
          compiler-cache-bucket: ${{ secrets.CI_CACHE_BUCKET }}
          compiler-cache-access-key: ${{ secrets.CI_CACHE_ACCESS_KEY }}
          compiler-cache-secret-key: ${{ secrets.CI_CACHE_SECRET_KEY }}
      - name: Check for cargo-binstall
        id: cargo-binstall
        shell: bash
        run: |
          if command -v cargo-binstall >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install cargo-binstall
        if: steps.cargo-binstall.outputs.available != 'true'
        uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1
        with:
          version: "1.21.1"
      - name: Install or update cargo-flux
        run: cargo binstall cargo-flux --no-confirm --force
      - name: Check WebAssembly targets
        run: cargo flux run check-wasm
        env:
          RUSTC_BOOTSTRAP: "1"
      - uses: ignition-is-go/pulse-actions/actions/report-resources@2c94ebf4fedd47f0c36d491e0dee5ad446a071b5 # v1.0.0
        if: always()
