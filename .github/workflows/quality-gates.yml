name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native quality gates
    runs-on:
      group: ci-untrusted
      labels: [self-hosted, Linux, X64, ram-ge-16g, disk-ge-100g]
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CI_NATIVE_CACHE_POLICY: native-ci-debug0-noincremental-v1
      CI_NATIVE_CACHE_CONFIGURED: ${{ (secrets.CI_CACHE_S3_ACCESS_KEY_ID || secrets.CI_CACHE_ACCESS_KEY) != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ignition-is-go/pulse-actions/actions/setup-rust@9a22a3c3987bfa13c1619f6bc3ff14de893e35e8
        with:
          components: rustfmt, clippy
          cache-shared-key: ${{ env.CI_NATIVE_CACHE_POLICY }}
          # Remote compiler-cache timeouts exhausted the native job's hour limit.
          # Keep the Cargo target cache; native builds do not use sccache.
          cache-save-if: ${{ env.CI_NATIVE_CACHE_CONFIGURED != 'true' }}
          cache-targets: ${{ env.CI_NATIVE_CACHE_CONFIGURED != 'true' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install GPUI Linux dependencies
        run: |
          sudo sed -i 's|http://|https://|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev postgresql libpq-dev
      - run: bun install --frozen-lockfile
      - name: Set up Cargo Flux and ROSE cache
        uses: ignition-is-go/cargo-flux@ae2ffa5f4420add3ab3c98665a4b5c0374bf2a5b
        with:
          version: 0.12.0
          cache: ${{ env.CI_NATIVE_CACHE_CONFIGURED == 'true' && 's3' || '' }}
          cache-endpoint: ${{ vars.CI_CACHE_S3_ENDPOINT || secrets.CI_CACHE_ENDPOINT }}
          cache-bucket: ${{ vars.CI_CACHE_S3_BUCKET || secrets.CI_CACHE_BUCKET }}
          cache-access-key-id: ${{ secrets.CI_CACHE_S3_ACCESS_KEY_ID || secrets.CI_CACHE_ACCESS_KEY }}
          cache-secret-access-key: ${{ secrets.CI_CACHE_S3_SECRET_ACCESS_KEY || secrets.CI_CACHE_SECRET_KEY }}
      - name: Restore ROSE compiler snapshot
        id: compiler-snapshot
        if: env.CI_NATIVE_CACHE_CONFIGURED == 'true'
        uses: ignition-is-go/pulse-actions/actions/flux-target-cache@9a22a3c3987bfa13c1619f6bc3ff14de893e35e8
        with:
          operation: restore
          scope: ${{ env.CI_NATIVE_CACHE_POLICY }}
          plugin: cargo
      - name: Verify publication ordering and recovery
        run: cargo flux run test-publish
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust and generated TypeScript
        run: cargo flux run check
      - name: Run strict Clippy and frontend lint
        run: cargo flux run lint
      - name: Run Rust and frontend tests
        # One test at a time. hyphae's reactive world is process-global by
        # design: `hyphae::batch` opens a window on a shared, deliberately
        # cross-thread tick queue so several producer threads can feed one
        # graph and settle together. Rust runs a binary's tests on parallel
        # threads in ONE process, so two tests are two graphs in one world —
        # while test A is inside a batch, test B's `set` is enqueued for A's
        # drain instead of propagating, and B asserts on a stale value. That
        # is what failed 8-16 tests at random on every run, main included.
        run: cargo flux run test
        env:
          RUST_TEST_THREADS: "1"
      - name: Test PostgreSQL history persistence
        run: cargo flux run test-postgres-provenance
      - name: Test authenticated transaction undo
        run: cargo flux run test-transaction-undo
      - name: Test PostgreSQL history subscriptions
        run: cargo flux run test-history-feed
      - name: Test typegen renderer and macro defaults
        run: |
          cargo test -p myko --lib --features codegen-ts codegen::typescript::
          cargo test -p myko-macros --lib
      - name: Check feature boundaries
        run: |
          cargo check --workspace --exclude myko-gpui --all-targets --no-default-features
          cargo check -p myko --all-targets --no-default-features --features typegen
          cargo check -p myko --all-targets --no-default-features --features codegen-ts
          cargo check -p myko-server --all-targets --no-default-features
      - name: Save ROSE snapshot and clean local Cargo targets
        if: success() && steps.compiler-snapshot.outputs.state != ''
        uses: ignition-is-go/pulse-actions/actions/flux-target-cache@9a22a3c3987bfa13c1619f6bc3ff14de893e35e8
        with:
          operation: save
          state: ${{ steps.compiler-snapshot.outputs.state }}
      - uses: ignition-is-go/pulse-actions/actions/report-resources@2c94ebf4fedd47f0c36d491e0dee5ad446a071b5 # v1.0.0
        if: always()

  gpui:
    name: GPUI quality gates
    runs-on:
      group: ci-untrusted
      labels: [self-hosted, Linux, X64, ram-ge-16g, disk-ge-100g]
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "4"
      CI_NATIVE_CACHE_CONFIGURED: ${{ (secrets.CI_CACHE_S3_ACCESS_KEY_ID || secrets.CI_CACHE_ACCESS_KEY) != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ignition-is-go/pulse-actions/actions/setup-rust@9a22a3c3987bfa13c1619f6bc3ff14de893e35e8
        with:
          components: clippy
          cache-shared-key: ci-gpui
          # Remote compiler-cache timeouts exhausted the native job's hour limit.
          # Keep the Cargo target cache; native builds do not use sccache.
          cache-save-if: ${{ env.CI_NATIVE_CACHE_CONFIGURED != 'true' }}
          cache-targets: ${{ env.CI_NATIVE_CACHE_CONFIGURED != 'true' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install GPUI Linux dependencies
        run: |
          sudo sed -i 's|http://|https://|g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev postgresql libpq-dev
      - run: bun install --frozen-lockfile
      - name: Set up Cargo Flux and ROSE cache
        uses: ignition-is-go/cargo-flux@ae2ffa5f4420add3ab3c98665a4b5c0374bf2a5b
        with:
          version: 0.12.0
          cache: ${{ env.CI_NATIVE_CACHE_CONFIGURED == 'true' && 's3' || '' }}
          cache-endpoint: ${{ vars.CI_CACHE_S3_ENDPOINT || secrets.CI_CACHE_ENDPOINT }}
          cache-bucket: ${{ vars.CI_CACHE_S3_BUCKET || secrets.CI_CACHE_BUCKET }}
          cache-access-key-id: ${{ secrets.CI_CACHE_S3_ACCESS_KEY_ID || secrets.CI_CACHE_ACCESS_KEY }}
          cache-secret-access-key: ${{ secrets.CI_CACHE_S3_SECRET_ACCESS_KEY || secrets.CI_CACHE_SECRET_KEY }}
      - name: Restore ROSE compiler snapshot
        id: compiler-snapshot
        if: env.CI_NATIVE_CACHE_CONFIGURED == 'true'
        uses: ignition-is-go/pulse-actions/actions/flux-target-cache@9a22a3c3987bfa13c1619f6bc3ff14de893e35e8
        with:
          operation: restore
          scope: gpui
          plugin: cargo
      - name: Check myko-gpui
        run: cargo flux run check-gpui
      - name: Run strict Clippy on myko-gpui
        run: cargo flux run lint-gpui
      - name: Run myko-gpui tests
        run: cargo flux run test-gpui
        env:
          RUST_TEST_THREADS: "1"
      - name: Check myko-gpui without default features
        run: cargo check -p myko-gpui --all-targets --no-default-features
      - name: Verify myko-gpui is publishable
        # Package myko alongside myko-gpui so the verify build resolves myko
        # from this checkout. Alone, it resolves the last published myko and
        # fails any change that adds myko API and uses it in myko-gpui.
        run: cargo publish --dry-run --locked --allow-dirty -p myko -p myko-gpui
      - name: Save ROSE snapshot and clean local Cargo targets
        if: success() && steps.compiler-snapshot.outputs.state != ''
        uses: ignition-is-go/pulse-actions/actions/flux-target-cache@9a22a3c3987bfa13c1619f6bc3ff14de893e35e8
        with:
          operation: save
          state: ${{ steps.compiler-snapshot.outputs.state }}
      - uses: ignition-is-go/pulse-actions/actions/report-resources@2c94ebf4fedd47f0c36d491e0dee5ad446a071b5 # v1.0.0
        if: always()

  wasm:
    name: WebAssembly check
    runs-on:
      group: ci-untrusted
      labels: [self-hosted, Linux, X64, ram-ge-16g, disk-ge-100g]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ignition-is-go/pulse-actions/actions/setup-rust@9a22a3c3987bfa13c1619f6bc3ff14de893e35e8
        with:
          targets: wasm32-unknown-unknown
          linux-dependencies: build
          cache-shared-key: ci-wasm
          compiler-cache-endpoint: ${{ secrets.CI_CACHE_ENDPOINT }}
          compiler-cache-bucket: ${{ secrets.CI_CACHE_BUCKET }}
          compiler-cache-access-key: ${{ secrets.CI_CACHE_ACCESS_KEY }}
          compiler-cache-secret-key: ${{ secrets.CI_CACHE_SECRET_KEY }}
          cache-save-if: ${{ env.CI_NATIVE_CACHE_CONFIGURED != 'true' }}
          cache-targets: ${{ env.CI_NATIVE_CACHE_CONFIGURED != 'true' }}
      - name: Set up Cargo Flux and ROSE cache
        uses: ignition-is-go/cargo-flux@ae2ffa5f4420add3ab3c98665a4b5c0374bf2a5b
        with:
          version: 0.12.0
          cache: ${{ env.CI_NATIVE_CACHE_CONFIGURED == 'true' && 's3' || '' }}
          cache-endpoint: ${{ vars.CI_CACHE_S3_ENDPOINT || secrets.CI_CACHE_ENDPOINT }}
          cache-bucket: ${{ vars.CI_CACHE_S3_BUCKET || secrets.CI_CACHE_BUCKET }}
          cache-access-key-id: ${{ secrets.CI_CACHE_S3_ACCESS_KEY_ID || secrets.CI_CACHE_ACCESS_KEY }}
          cache-secret-access-key: ${{ secrets.CI_CACHE_S3_SECRET_ACCESS_KEY || secrets.CI_CACHE_SECRET_KEY }}
      - name: Restore ROSE compiler snapshot
        id: compiler-snapshot
        if: env.CI_NATIVE_CACHE_CONFIGURED == 'true'
        uses: ignition-is-go/pulse-actions/actions/flux-target-cache@9a22a3c3987bfa13c1619f6bc3ff14de893e35e8
        with:
          operation: restore
          scope: wasm
          plugin: cargo
      - name: Check WebAssembly targets
        run: cargo flux run check-wasm
        env:
          RUSTC_BOOTSTRAP: "1"
      - name: Save ROSE snapshot and clean local Cargo targets
        if: success() && steps.compiler-snapshot.outputs.state != ''
        uses: ignition-is-go/pulse-actions/actions/flux-target-cache@9a22a3c3987bfa13c1619f6bc3ff14de893e35e8
        with:
          operation: save
          state: ${{ steps.compiler-snapshot.outputs.state }}
      - uses: ignition-is-go/pulse-actions/actions/report-resources@2c94ebf4fedd47f0c36d491e0dee5ad446a071b5 # v1.0.0
        if: always()
    env:
      CI_NATIVE_CACHE_CONFIGURED: ${{ (secrets.CI_CACHE_S3_ACCESS_KEY_ID || secrets.CI_CACHE_ACCESS_KEY) != '' }}
