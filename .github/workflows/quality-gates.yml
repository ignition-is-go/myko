name: Quality gates

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-native
      - name: Install GPUI Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev
      - run: bun install --frozen-lockfile
      - name: Check for cargo-binstall
        id: cargo-binstall
        shell: bash
        run: |
          if command -v cargo-binstall >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install cargo-binstall
        if: steps.cargo-binstall.outputs.available != 'true'
        uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1
        with:
          version: "1.21.1"
      - name: Install or update cargo-flux
        run: cargo binstall cargo-flux --no-confirm --force
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check Rust and generated TypeScript
        run: cargo flux run check
      - name: Run strict Clippy and frontend lint
        run: cargo flux run lint
      - name: Run Rust and frontend tests
        # One test at a time. hyphae's reactive world is process-global by
        # design: `hyphae::batch` opens a window on a shared, deliberately
        # cross-thread tick queue so several producer threads can feed one
        # graph and settle together. Rust runs a binary's tests on parallel
        # threads in ONE process, so two tests are two graphs in one world —
        # while test A is inside a batch, test B's `set` is enqueued for A's
        # drain instead of propagating, and B asserts on a stale value. That
        # is what failed 8-16 tests at random on every run, main included.
        run: cargo flux run test
        env:
          RUST_TEST_THREADS: "1"
      - name: Verify myko-gpui is publishable
        run: cargo publish --dry-run --locked --allow-dirty -p myko-gpui
      - name: Test typegen renderer and macro defaults
        run: |
          cargo test -p myko --lib --features codegen-ts codegen::typescript::
          cargo test -p myko-macros --lib
      - name: Check feature boundaries
        run: |
          cargo check --workspace --all-targets --no-default-features
          cargo check -p myko --all-targets --no-default-features --features typegen
          cargo check -p myko --all-targets --no-default-features --features codegen-ts
          cargo check -p myko-server --all-targets --no-default-features

  wasm:
    name: WebAssembly check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-wasm
      - name: Check for cargo-binstall
        id: cargo-binstall
        shell: bash
        run: |
          if command -v cargo-binstall >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install cargo-binstall
        if: steps.cargo-binstall.outputs.available != 'true'
        uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1
        with:
          version: "1.21.1"
      - name: Install or update cargo-flux
        run: cargo binstall cargo-flux --no-confirm --force
      - name: Check WebAssembly targets
        run: cargo flux run check-wasm
        env:
          RUSTC_BOOTSTRAP: "1"
